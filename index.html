<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sebastian Ryder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #e6e6e6;
      --muted: #a0a0a0;
      --accent: #fe7d6a;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
    }

    .container {
      padding: 1.5rem;
      max-width: 480px;
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .palms {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      margin: 0 0 0.75rem 0;
    }

    p {
      margin: 0.35rem 0;
      color: var(--muted);
    }

    .age {
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .age span {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .projects {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid #333;
    }

    .projects p.label {
      color: var(--fg);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Sebastian Ryder</h1>
    <p>LSE Year 2 &mdash; PPE</p>


    <div class="projects">
      <p class="label">Smaregi</p>
      <p>
        <a href="./cashless/">Japan Cashless Adoption (for Smaregi pitch)</a>
        &mdash; How digital payments are (unevenly) distributed amongst Japanese businesses
      </p>
    </div>
  </div>

  <script>
    var emojiPool = [
      "\uD83C\uDF34", "\uD83C\uDF0A", "\u2600\uFE0F", "\uD83C\uDFD6\uFE0F",
      "\uD83E\uDD65", "\uD83C\uDF3A", "\uD83D\uDE80", "\uD83C\uDF19",
      "\uD83C\uDFB6", "\u26A1"
    ];

    function randomEmojis(count) {
      if (!count) count = 3;
      var result = "";
      for (var i = 0; i < count; i++) {
        result += emojiPool[Math.floor(Math.random() * emojiPool.length)];
      }
      return result;
    }

    document.getElementById("emojis").textContent = randomEmojis();

    var birthDate = new Date(2006, 4, 30, 17, 0, 0);

    function updateAge() {
      var now = new Date();
      var ageMs = now - birthDate;
      var ageYears = ageMs / (1000 * 60 * 60 * 24 * 365.2425);
      document.getElementById("age").textContent = ageYears.toFixed(9);
    }

    updateAge();
    setInterval(updateAge, 5);
  </script>
</body>
</html>
