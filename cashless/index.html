<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Cashless Adoption Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: helvetica;
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 18px;
      color: #94a3b8;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      background: #1e293b;
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 32px;
      max-width: 560px;
      margin: 80px auto;
      text-align: center;
    }

    .error-box h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .error-box p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .header p {
      color: #94a3b8;
      font-size: 13px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn:hover {
      background: #334155;
    }

    .tab-btn.active {
      background: #6366f1;
      color: white;
    }

    /* Stat cards */
    .stat-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px 20px;
      flex: 1 1 140px;
      min-width: 140px;
    }

    .stat-card .label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
    }

    .stat-card .sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Section title */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 32px 0 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    /* Bar chart (CSS) */
    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bar-label {
      width: 130px;
      min-width: 130px;
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      display: flex;
      gap: 3px;
      height: 24px;
      align-items: center;
    }

    .bar-segment {
      height: 100%;
      border-radius: 3px;
      min-width: 0;
      transition: width 0.4s ease;
    }

    .bar-value {
      font-size: 12px;
      color: #94a3b8;
      min-width: 42px;
      text-align: right;
    }

    /* Grouped bar chart */
    .grouped-chart {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .grouped-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .grouped-col .col-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .grouped-bars {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      height: 180px;
    }

    .v-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .v-bar-container {
      width: 32px;
      height: 160px;
      background: #1e293b;
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .v-bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      transition: height 0.4s ease;
    }

    .v-bar-val {
      font-size: 11px;
      font-weight: 600;
    }

    .v-bar-name {
      font-size: 10px;
      color: #94a3b8;
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      padding: 10px 12px;
      text-align: left;
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 2px solid #334155;
    }

    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
    }

    .mini-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-bar-track {
      width: 80px;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }

    .mini-bar-fill {
      height: 100%;
      border-radius: 4px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* Heatmap */
    .heatmap-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .heatmap-table th {
      padding: 10px;
      color: #94a3b8;
      font-weight: 600;
    }

    .heatmap-table td {
      padding: 10px;
      border-bottom: 1px solid #334155;
    }

    .heatmap-cell {
      text-align: center;
      border-radius: 6px;
      padding: 10px;
    }

    .heatmap-cell .pct {
      font-weight: 700;
      font-size: 16px;
    }

    .heatmap-cell .n {
      font-size: 11px;
      color: #94a3b8;
    }

    .heatmap-cell .nfc-val {
      font-size: 11px;
      color: #06b6d4;
    }

    /* Insight cards */
    .insight-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }

    .insight-card .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .insight-card .body {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.7;
    }

    /* Legend */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 12px 0 20px;
      font-size: 12px;
      color: #94a3b8;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .footer {
      margin-top: 40px;
      padding: 16px 0;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .overflow-x {
      overflow-x: auto;
    }

    .text-credit { color: #6366f1; }
    .text-nfc { color: #06b6d4; }
    .text-cash { color: #f59e0b; }
    .text-muted { color: #94a3b8; }
    .fw600 { font-weight: 600; }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    Loading dashboard data...
  </div>

  <div id="error-container" style="display:none;"></div>

  <div id="dashboard" class="wrap" style="display:none;">
    <div class="header">
      <h1>&#127471;&#127477; Japan Cashless Adoption Dashboard</h1>
      <p id="subtitle"></p>
    </div>

    <div class="tabs" id="tabs"></div>

    <div id="tab-overview" class="tab-content active"></div>
    <div id="tab-biztype" class="tab-content"></div>
    <div id="tab-geography" class="tab-content"></div>
    <div id="tab-heatmap" class="tab-content"></div>
    <div id="tab-insights" class="tab-content"></div>

    <div class="footer" id="footer"></div>
  </div>

  <script>
    /* ========================================
       CONFIGURATION
       ======================================== */

    var LOCATION_TYPES = {
      "Tokyo_Shibuya": "Major Urban",
      "Tokyo_Shinjuku": "Major Urban",
      "Tokyo_Asakusa": "Major Urban",
      "Osaka_Namba": "Major Urban",
      "Osaka_Umeda": "Major Urban",
      "Nagoya_Sakae": "Major Urban",
      "Fukuoka_Tenjin": "Major Urban",
      "Sapporo_Susukino": "Major Urban",
      "Sendai_Station": "Mid-size City",
      "Hiroshima_Central": "Mid-size City",
      "Kanazawa_Central": "Mid-size City",
      "Matsuyama_Central": "Mid-size City",
      "Takayama_Old_Town": "Small / Rural",
      "Nikko_Town": "Small / Rural",
      "Onomichi_Town": "Small / Rural",
      "Tono_Iwate": "Small / Rural",
      "Kamikochi_Area": "Small / Rural",
      "Aso_Kumamoto": "Small / Rural"
    };

    var URBAN_ORDER = ["Major Urban", "Mid-size City", "Small / Rural"];

    var BIZ_LABELS = {
      convenience_store: "Convenience Store",
      supermarket: "Supermarket",
      drugstore: "Drugstore",
      restaurant: "Restaurant",
      ramen_restaurant: "Ramen Shop",
      izakaya: "Izakaya",
      cafe: "Cafe",
      bakery: "Bakery",
      book_store: "Bookstore",
      hair_salon: "Hair Salon",
      florist: "Florist"
    };

    /* ========================================
       HELPERS
       ======================================== */

    function pct(n, d) {
      return d ? Math.round((n / d) * 1000) / 10 : 0;
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function legendHTML() {
      return '<div class="legend">' +
        '<div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div>Credit Cards</div>' +
        '<div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>NFC</div>' +
        '<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Cash Only</div>' +
        '<div class="legend-item"><div class="legend-dot" style="background:#94a3b8"></div>No Data</div>' +
      '</div>';
    }

    function badgeHTML(urbanType) {
      var color, bg;
      if (urbanType === "Major Urban") {
        color = "#6366f1"; bg = "rgba(99,102,241,0.2)";
      } else if (urbanType === "Mid-size City") {
        color = "#06b6d4"; bg = "rgba(6,182,212,0.2)";
      } else {
        color = "#f59e0b"; bg = "rgba(245,158,11,0.2)";
      }
      return '<span class="badge" style="background:' + bg + ';color:' + color + '">' + esc(urbanType) + '</span>';
    }

    /* ========================================
       TAB SWITCHING
       ======================================== */

    var currentTab = "overview";

    function switchTab(id) {
      currentTab = id;
      var allTabs = document.querySelectorAll(".tab-content");
      for (var i = 0; i < allTabs.length; i++) {
        allTabs[i].classList.remove("active");
      }
      document.getElementById("tab-" + id).classList.add("active");

      var allBtns = document.querySelectorAll(".tab-btn");
      for (var j = 0; j < allBtns.length; j++) {
        allBtns[j].classList.remove("active");
      }
      document.getElementById("btn-" + id).classList.add("active");
    }

    /* ========================================
       BUILD DASHBOARD
       ======================================== */

    function buildDashboard(data) {
      /* --- Process rows --- */
      var rows = [];
      for (var i = 0; i < data.length; i++) {
        var r = data[i];
        rows.push({
          place_id: r.place_id,
          name: r.name || "",
          address: r.address || "",
          primary_type: r.primary_type || "",
          search_location: r.search_location || "",
          search_category: r.search_category || "",
          collected_at: r.collected_at || "",
          rating: r.rating,
          user_rating_count: r.user_rating_count,
          accepts_credit_cards: r.accepts_credit_cards === true || r.accepts_credit_cards === "True",
          accepts_debit_cards: r.accepts_debit_cards === true || r.accepts_debit_cards === "True",
          accepts_cash_only: r.accepts_cash_only === true || r.accepts_cash_only === "True",
          accepts_nfc: r.accepts_nfc === true || r.accepts_nfc === "True",
          has_payment_data: [r.accepts_credit_cards, r.accepts_debit_cards, r.accepts_cash_only, r.accepts_nfc]
            .some(function(v) { return v !== "" && v !== null && v !== undefined && v !== false; }),
          urban_type: LOCATION_TYPES[r.search_location] || "Unknown",
          biz_label: BIZ_LABELS[r.search_category] || r.search_category
        });
      }

      if (rows.length === 0) {
        showError("CSV loaded but contained no data rows.");
        return;
      }

      /* --- Aggregate --- */
      var total = rows.length;
      var withData = rows.filter(function(r) { return r.has_payment_data; }).length;
      var cc = rows.filter(function(r) { return r.accepts_credit_cards; }).length;
      var nfc = rows.filter(function(r) { return r.accepts_nfc; }).length;
      var cashOnly = rows.filter(function(r) { return r.accepts_cash_only; }).length;

      /* By biz type */
      var bizSet = {};
      rows.forEach(function(r) { bizSet[r.search_category] = true; });
      var bizTypes = Object.keys(bizSet);

      var byBiz = bizTypes.map(function(bt) {
        var sub = rows.filter(function(r) { return r.search_category === bt; });
        var wd = sub.filter(function(r) { return r.has_payment_data; }).length;
        return {
          name: BIZ_LABELS[bt] || bt,
          key: bt,
          total: sub.length,
          creditCards: pct(sub.filter(function(r) { return r.accepts_credit_cards; }).length, sub.length),
          nfc: pct(sub.filter(function(r) { return r.accepts_nfc; }).length, sub.length),
          cashOnly: pct(sub.filter(function(r) { return r.accepts_cash_only; }).length, sub.length),
          noPaymentData: pct(sub.length - wd, sub.length)
        };
      }).sort(function(a, b) { return b.creditCards - a.creditCards; });

      /* By urban type */
      var byUrban = URBAN_ORDER.map(function(ut) {
        var sub = rows.filter(function(r) { return r.urban_type === ut; });
        if (!sub.length) return null;
        var wd = sub.filter(function(r) { return r.has_payment_data; }).length;
        return {
          name: ut,
          total: sub.length,
          creditCards: pct(sub.filter(function(r) { return r.accepts_credit_cards; }).length, sub.length),
          nfc: pct(sub.filter(function(r) { return r.accepts_nfc; }).length, sub.length),
          cashOnly: pct(sub.filter(function(r) { return r.accepts_cash_only; }).length, sub.length),
          noPaymentData: pct(sub.length - wd, sub.length)
        };
      }).filter(Boolean);

      /* By location */
      var locSet = {};
      rows.forEach(function(r) { locSet[r.search_location] = true; });
      var byLocation = Object.keys(locSet).map(function(loc) {
        var sub = rows.filter(function(r) { return r.search_location === loc; });
        var wd = sub.filter(function(r) { return r.has_payment_data; }).length;
        return {
          name: loc.replace(/_/g, " "),
          key: loc,
          urbanType: LOCATION_TYPES[loc] || "Unknown",
          total: sub.length,
          creditCards: pct(sub.filter(function(r) { return r.accepts_credit_cards; }).length, sub.length),
          nfc: pct(sub.filter(function(r) { return r.accepts_nfc; }).length, sub.length),
          cashOnly: pct(sub.filter(function(r) { return r.accepts_cash_only; }).length, sub.length),
          noPaymentData: pct(sub.length - wd, sub.length)
        };
      }).sort(function(a, b) { return b.creditCards - a.creditCards; });

      /* Heatmap */
      var heatmap = [];
      bizTypes.forEach(function(bt) {
        URBAN_ORDER.forEach(function(ut) {
          var sub = rows.filter(function(r) { return r.search_category === bt && r.urban_type === ut; });
          if (sub.length > 0) {
            heatmap.push({
              bizType: BIZ_LABELS[bt] || bt,
              bizKey: bt,
              urbanType: ut,
              count: sub.length,
              creditCards: pct(sub.filter(function(r) { return r.accepts_credit_cards; }).length, sub.length),
              nfc: pct(sub.filter(function(r) { return r.accepts_nfc; }).length, sub.length),
              cashOnly: pct(sub.filter(function(r) { return r.accepts_cash_only; }).length, sub.length)
            });
          }
        });
      });

      /* --- Render tabs --- */
      var tabDefs = [
        { id: "overview", label: "Overview" },
        { id: "biztype", label: "By Business Type" },
        { id: "geography", label: "By Geography" },
        { id: "heatmap", label: "Heatmap" },
        { id: "insights", label: "Key Insights" }
      ];

      var tabsHTML = "";
      tabDefs.forEach(function(t) {
        tabsHTML += '<button class="tab-btn' + (t.id === "overview" ? " active" : "") +
          '" id="btn-' + t.id + '" onclick="switchTab(\'' + t.id + '\')">' + t.label + '</button>';
      });
      document.getElementById("tabs").innerHTML = tabsHTML;

      document.getElementById("subtitle").textContent =
        "Payment acceptance data across " + total + " businesses \u00B7 Source: Google Places API";

      var collectedDate = rows[0].collected_at ? rows[0].collected_at.split("T")[0] : "recently";
      document.getElementById("footer").textContent =
        "Data source: Google Places API (New) \u00B7 paymentOptions field \u00B7 Collected " + collectedDate;

      /* ---- OVERVIEW ---- */
      var overviewHTML = '<div class="stat-row">';
      overviewHTML += statCardHTML("Total Places", total, "", "");
      overviewHTML += statCardHTML("Have Payment Data", withData, pct(withData, total) + "% of total", "#818cf8");
      overviewHTML += statCardHTML("Accept Credit Cards", cc, pct(cc, total) + "%", "#6366f1");
      overviewHTML += statCardHTML("Accept NFC", nfc, pct(nfc, total) + "%", "#06b6d4");
      overviewHTML += statCardHTML("Cash Only", cashOnly, pct(cashOnly, total) + "%", "#f59e0b");
      overviewHTML += '</div>';

      overviewHTML += '<h2 class="section-title">Payment Acceptance by Business Type</h2>';
      overviewHTML += legendHTML();
      overviewHTML += horizontalBarsHTML(byBiz, true);

      overviewHTML += '<h2 class="section-title">Urban vs Rural</h2>';
      overviewHTML += verticalGroupedHTML(byUrban);

      document.getElementById("tab-overview").innerHTML = overviewHTML;

      /* ---- BIZ TYPE ---- */
      var bizHTML = '<h2 class="section-title">Detailed Breakdown by Business Type</h2>';
      bizHTML += '<div class="overflow-x"><table class="data-table"><thead><tr>';
      bizHTML += '<th>Business Type</th><th>Count</th><th>Credit Cards %</th><th>NFC %</th><th>Cash Only %</th><th>No Data %</th>';
      bizHTML += '</tr></thead><tbody>';
      byBiz.forEach(function(r) {
        bizHTML += '<tr>';
        bizHTML += '<td class="fw600">' + esc(r.name) + '</td>';
        bizHTML += '<td>' + r.total + '</td>';
        bizHTML += miniBarTD(r.creditCards, "#6366f1");
        bizHTML += miniBarTD(r.nfc, "#06b6d4");
        bizHTML += miniBarTD(r.cashOnly, "#f59e0b");
        bizHTML += '<td class="text-muted">' + r.noPaymentData + '%</td>';
        bizHTML += '</tr>';
      });
      bizHTML += '</tbody></table></div>';

      bizHTML += '<h2 class="section-title">Credit Card Acceptance by Business Type</h2>';
      bizHTML += horizontalBarsHTML(byBiz.map(function(b) {
        return { name: b.name, creditCards: b.creditCards, nfc: 0, cashOnly: 0 };
      }), false);

      document.getElementById("tab-biztype").innerHTML = bizHTML;

      /* ---- GEOGRAPHY ---- */
      var geoHTML = '<h2 class="section-title">By Specific Location</h2>';
      geoHTML += '<div class="overflow-x"><table class="data-table"><thead><tr>';
      geoHTML += '<th>Location</th><th>Type</th><th>Count</th><th>Credit Cards %</th><th>NFC %</th><th>Cash Only %</th><th>No Data %</th>';
      geoHTML += '</tr></thead><tbody>';
      byLocation.forEach(function(r) {
        geoHTML += '<tr>';
        geoHTML += '<td class="fw600">' + esc(r.name) + '</td>';
        geoHTML += '<td>' + badgeHTML(r.urbanType) + '</td>';
        geoHTML += '<td>' + r.total + '</td>';
        geoHTML += '<td class="text-credit fw600">' + r.creditCards + '%</td>';
        geoHTML += '<td class="text-nfc">' + r.nfc + '%</td>';
        geoHTML += '<td class="text-cash">' + r.cashOnly + '%</td>';
        geoHTML += '<td class="text-muted">' + r.noPaymentData + '%</td>';
        geoHTML += '</tr>';
      });
      geoHTML += '</tbody></table></div>';

      geoHTML += '<h2 class="section-title">Credit Card Acceptance by Location</h2>';
      geoHTML += locationBarsHTML(byLocation);

      document.getElementById("tab-geography").innerHTML = geoHTML;

      /* ---- HEATMAP ---- */
      var hmHTML = '<h2 class="section-title">Credit Card Acceptance: Business Type &times; Urban/Rural</h2>';
      hmHTML += '<p style="color:#94a3b8;font-size:13px;margin-bottom:20px;line-height:1.6">' +
        'Does cashless adoption vary by both business type AND location type? ' +
        'Darker purple = higher credit card acceptance. Orange = lower.</p>';

      var hmBizTypes = [];
      var hmBizSet = {};
      heatmap.forEach(function(h) {
        if (!hmBizSet[h.bizType]) {
          hmBizSet[h.bizType] = true;
          hmBizTypes.push(h.bizType);
        }
      });

      hmHTML += '<div class="overflow-x"><table class="heatmap-table"><thead><tr>';
      hmHTML += '<th style="text-align:left">Business Type</th>';
      URBAN_ORDER.forEach(function(u) {
        hmHTML += '<th style="text-align:center;min-width:130px">' + esc(u) + '</th>';
      });
      hmHTML += '</tr></thead><tbody>';

      hmBizTypes.forEach(function(bt) {
        hmHTML += '<tr>';
        hmHTML += '<td class="fw600">' + esc(bt) + '</td>';
        URBAN_ORDER.forEach(function(ut) {
          var cell = heatmap.find(function(h) { return h.bizType === bt && h.urbanType === ut; });
          if (!cell) {
            hmHTML += '<td style="text-align:center;color:#94a3b8">&mdash;</td>';
          } else {
            var intensity = cell.creditCards / 100;
            var bg = intensity > 0.5
              ? "rgba(99,102,241," + (0.15 + intensity * 0.45) + ")"
              : "rgba(245,158,11," + (0.1 + (1 - intensity) * 0.25) + ")";
            hmHTML += '<td><div class="heatmap-cell" style="background:' + bg + '">';
            hmHTML += '<div class="pct">' + cell.creditCards + '%</div>';
            hmHTML += '<div class="n">n=' + cell.count + '</div>';
            hmHTML += '<div class="nfc-val">NFC: ' + cell.nfc + '%</div>';
            hmHTML += '</div></td>';
          }
        });
        hmHTML += '</tr>';
      });
      hmHTML += '</tbody></table></div>';

      document.getElementById("tab-heatmap").innerHTML = hmHTML;

      /* ---- INSIGHTS ---- */
      var insHTML = '<h2 class="section-title">Automated Insights</h2>';
      var insights = [];

      if (byBiz.length > 1) {
        var top = byBiz[0], bottom = byBiz[byBiz.length - 1];
        var gap = top.creditCards - bottom.creditCards;
        var verdict = gap > 30 ? "This is a massive disparity — strongly supporting the hypothesis of uneven adoption."
          : (gap > 15 ? "A significant gap suggesting meaningful variation." : "Relatively modest variation across types.");
        insights.push({
          icon: "\uD83D\uDCCA", title: "Cashless adoption gap",
          text: "The gap between the most cashless business type (" + top.name + " at " + top.creditCards + "%) and the least (" + bottom.name + " at " + bottom.creditCards + "%) is " + gap.toFixed(1) + " percentage points. " + verdict
        });
      }

      var urban = byUrban.find(function(u) { return u.name === "Major Urban"; });
      var rural = byUrban.find(function(u) { return u.name === "Small / Rural"; });
      if (urban && rural) {
        var urg = urban.creditCards - rural.creditCards;
        var uv = urg > 20 ? "Strong evidence of geographic digital divide."
          : (urg > 10 ? "A moderate urban-rural gap." : "Surprisingly small urban-rural gap.");
        insights.push({
          icon: "\uD83C\uDFD9\uFE0F", title: "Urban\u2013rural divide",
          text: "Major urban: " + urban.creditCards + "% credit card acceptance vs small/rural: " + rural.creditCards + "% \u2014 a " + urg.toFixed(1) + " point gap. " + uv
        });
        insights.push({
          icon: "\uD83D\uDD0D", title: "Missing data as signal",
          text: rural.noPaymentData + "% of rural places have no payment data vs " + urban.noPaymentData + "% in cities. Missing data likely correlates with smaller, less-digitized businesses \u2014 the \u201Cdark matter\u201D of cash-only Japan."
        });
      }

      var nfcLeaders = byBiz.filter(function(b) { return b.nfc > b.creditCards; });
      if (nfcLeaders.length > 0) {
        insights.push({
          icon: "\uD83D\uDCF1", title: "NFC outpacing credit cards",
          text: "In " + nfcLeaders.map(function(n) { return n.name; }).join(", ") + ", NFC acceptance exceeds credit cards \u2014 reflecting Japan\u2019s strong IC card (Suica/Pasmo) ecosystem."
        });
      }

      var highCash = byBiz.filter(function(b) { return b.cashOnly > 10; }).sort(function(a, b) { return b.cashOnly - a.cashOnly; });
      if (highCash.length > 0) {
        insights.push({
          icon: "\uD83D\uDCB4", title: "Cash holdouts",
          text: "Most cash-resistant types: " + highCash.map(function(b) { return b.name + " (" + b.cashOnly + "% cash-only)"; }).join(", ") + ". Likely smaller independents where merchant fees are a deterrent."
        });
      }

      var conv = byBiz.find(function(b) { return b.key === "convenience_store"; });
      var ramen = byBiz.find(function(b) { return b.key === "ramen_restaurant"; });
      if (conv && ramen) {
        var cg = conv.creditCards - ramen.creditCards;
        insights.push({
          icon: "\uD83C\uDF5C", title: "Chain vs independent",
          text: "Convenience stores (chains): " + conv.creditCards + "% credit card acceptance. Ramen shops (independents): " + ramen.creditCards + "%. " + (cg > 20 ? "Directly supports the hypothesis that chains lead cashless adoption." : "Gap is smaller than expected.")
        });
      }

      insights.push({
        icon: "\u26A0\uFE0F", title: "Data limitations",
        text: "Dataset covers " + total + " places from Google\u2019s database. Payment data comes from user reports and algorithmic inference. " + pct(total - withData, total) + "% of places lack any payment data \u2014 the true cash-only rate is likely higher than measured."
      });

      insights.forEach(function(ins) {
        insHTML += '<div class="insight-card">';
        insHTML += '<div class="title">' + ins.icon + ' ' + esc(ins.title) + '</div>';
        insHTML += '<div class="body">' + esc(ins.text) + '</div>';
        insHTML += '</div>';
      });

      document.getElementById("tab-insights").innerHTML = insHTML;

      /* --- Show dashboard --- */
      document.getElementById("loading").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    /* ========================================
       HTML BUILDERS
       ======================================== */

    function statCardHTML(label, value, sub, color) {
      var c = color || "#e2e8f0";
      var html = '<div class="stat-card">';
      html += '<div class="label">' + esc(label) + '</div>';
      html += '<div class="value" style="color:' + c + '">' + value + '</div>';
      if (sub) html += '<div class="sub">' + esc(sub) + '</div>';
      html += '</div>';
      return html;
    }

    function miniBarTD(val, color) {
      return '<td><div class="mini-bar-wrap">' +
        '<div class="mini-bar-track"><div class="mini-bar-fill" style="width:' + val + '%;background:' + color + '"></div></div>' +
        '<span>' + val + '%</span></div></td>';
    }

    function horizontalBarsHTML(items, showAll) {
      var html = '<div class="bar-chart">';
      items.forEach(function(item) {
        html += '<div class="bar-row">';
        html += '<div class="bar-label">' + esc(item.name) + '</div>';
        html += '<div class="bar-track">';
        html += '<div class="bar-segment" style="width:' + item.creditCards + '%;background:#6366f1"></div>';
        if (showAll) {
          html += '<div class="bar-segment" style="width:' + item.nfc + '%;background:#06b6d4"></div>';
          html += '<div class="bar-segment" style="width:' + item.cashOnly + '%;background:#f59e0b"></div>';
        }
        html += '</div>';
        html += '<div class="bar-value">' + item.creditCards + '%</div>';
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function locationBarsHTML(items) {
      var html = '<div class="bar-chart">';
      items.forEach(function(item) {
        var color = item.urbanType === "Major Urban" ? "#6366f1"
          : (item.urbanType === "Mid-size City" ? "#06b6d4" : "#f59e0b");
        html += '<div class="bar-row">';
        html += '<div class="bar-label">' + esc(item.name) + '</div>';
        html += '<div class="bar-track">';
        html += '<div class="bar-segment" style="width:' + item.creditCards + '%;background:' + color + '"></div>';
        html += '</div>';
        html += '<div class="bar-value">' + item.creditCards + '%</div>';
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function verticalGroupedHTML(groups) {
      var metrics = [
        { key: "creditCards", label: "Credit", color: "#6366f1" },
        { key: "nfc", label: "NFC", color: "#06b6d4" },
        { key: "cashOnly", label: "Cash", color: "#f59e0b" },
        { key: "noPaymentData", label: "No Data", color: "#94a3b8" }
      ];

      var html = '<div class="grouped-chart">';
      groups.forEach(function(g) {
        html += '<div class="grouped-col">';
        html += '<div class="col-label">' + esc(g.name) + '</div>';
        html += '<div class="grouped-bars">';
        metrics.forEach(function(m) {
          var val = g[m.key];
          var h = Math.max(val * 1.6, 2);
          html += '<div class="v-bar-wrap">';
          html += '<div class="v-bar-val" style="color:' + m.color + '">' + val + '%</div>';
          html += '<div class="v-bar-container">';
          html += '<div class="v-bar" style="height:' + h + 'px;background:' + m.color + '"></div>';
          html += '</div>';
          html += '<div class="v-bar-name">' + m.label + '</div>';
          html += '</div>';
        });
        html += '</div></div>';
      });
      html += '</div>';
      return html;
    }

    /* ========================================
       ERROR HANDLING
       ======================================== */

    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error-container").style.display = "block";
      document.getElementById("error-container").innerHTML =
        '<div class="error-box">' +
        '<div style="font-size:36px;margin-bottom:12px">&#9888;&#65039;</div>' +
        '<h2>Error Loading Data</h2>' +
        '<p>' + esc(msg) + '</p>' +
        '</div>';
    }

    /* ========================================
       LOAD CSV AND GO
       ======================================== */

    Papa.parse("data.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      dynamicTyping: true,
      complete: function(results) {
        if (results.data && results.data.length > 0) {
          buildDashboard(results.data);
        } else {
          showError("CSV loaded but contained no data rows. Check that data.csv has content.");
        }
      },
      error: function(err) {
        showError("Could not load data.csv. Make sure it is in the same folder as this index.html file. Error: " + (err.message || err));
      }
    });
  </script>
</body>
</html>
